<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor - Inventário Hospitalar</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      color: #1f2937;
    }

    button {
      background: #1769aa;
      color: white;
      border: 0;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #leitor {
      width: 100%;
      margin-top: 20px;
    }

    #mensagem {
      margin-top: 15px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Leitor de códigos</h2>
    <p>Inventário Hospitalar</p>

    <button id="iniciar">Abrir câmera</button>
    <button id="fechar">Fechar câmera</button>

    <div id="leitor"></div>

    <div id="mensagem">
      Toque em Abrir câmera para começar.
    </div>

  </div>

  <script>

    let scanner = null;
    let leituraConcluida = false;
    let iniciando = false;

    const mensagem = document.getElementById('mensagem');
    const botaoIniciar = document.getElementById('iniciar');

    // Identifica a finalidade da leitura.
    const parametros = new URLSearchParams(window.location.search);
    const modoLeitura = parametros.get('modo') || 'pesquisa';

    if (modoLeitura === 'qr') {
      mensagem.textContent =
        'Leitura para cadastrar o QR Code do equipamento.';
    } else {
      mensagem.textContent =
        'Leitura para localizar o equipamento.';
    }

    // Formatos aceitos pelo leitor.
    const formatos = [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.PDF_417,
      Html5QrcodeSupportedFormats.DATA_MATRIX
    ];

    // Abre a câmera.
    document.getElementById('iniciar').onclick = async function() {

      if (iniciando || scanner) return;

      iniciando = true;
      leituraConcluida = false;
      botaoIniciar.disabled = true;

      try {

        mensagem.textContent = 'Solicitando acesso à câmera...';

        scanner = new Html5Qrcode('leitor', {
          formatsToSupport: formatos,
          verbose: false
        });

        await scanner.start(

          { facingMode: 'environment' },

          {
            fps: 10,
            qrbox: { width: 280, height: 180 },
            aspectRatio: 1.5
          },

          async function(codigo) {

            if (leituraConcluida) return;

            leituraConcluida = true;

            mensagem.textContent =
              'Código lido! Enviando ao formulário...';

            // Verifica se o formulário continua aberto.
            if (window.opener && !window.opener.closed) {

              // Envia código e finalidade da leitura.
              window.opener.postMessage(
                {
                  modo: modoLeitura,
                  codigo: codigo
                },
                'https://arlisontecnicoeletronico-create.github.io'
              );

              mensagem.textContent =
                'Código enviado! Retornando ao formulário...';

              // Encerra a câmera.
              try {

                if (scanner) {
                  await scanner.stop();
                  await scanner.clear();
                  scanner = null;
                }

              } catch (erro) {
                console.error('Erro ao fechar câmera:', erro);
              }

              // Retorna à aba do formulário.
              try {
                window.opener.focus();
              } catch (erro) {
                console.error('Erro ao retornar:', erro);
              }

              // Fecha automaticamente a aba do leitor.
              setTimeout(function() {
                window.close();
              }, 300);

            } else {

              mensagem.textContent =
                'Não foi possível localizar o formulário. ' +
                'Abra o leitor pelo botão do inventário.';

              try {

                if (scanner) {
                  await scanner.stop();
                  await scanner.clear();
                  scanner = null;
                }

              } catch (erro) {
                console.error('Erro ao fechar câmera:', erro);
              }

              botaoIniciar.disabled = false;
              iniciando = false;
            }

          },

          function() {}

        );

        mensagem.textContent =
          modoLeitura === 'qr'
            ? 'Aponte a câmera para o QR Code.'
            : 'Aponte a câmera para o código de barras ou QR Code.';

      } catch (erro) {

        mensagem.textContent =
          'Erro ao acessar câmera: ' + erro;

        try {

          if (scanner) {
            await scanner.clear();
          }

        } catch(e) {}

        scanner = null;
        botaoIniciar.disabled = false;
        iniciando = false;
      }

    };

    // Fecha a câmera manualmente.
    document.getElementById('fechar').onclick = async function() {

      if (scanner) {

        try {
          await scanner.stop();
          await scanner.clear();

        } catch (erro) {
          console.error('Erro ao fechar câmera:', erro);
        }

        scanner = null;
      }

      leituraConcluida = false;
      iniciando = false;
      botaoIniciar.disabled = false;

      mensagem.textContent = 'Câmera fechada.';
    };

  </script>

</body>
</html>
